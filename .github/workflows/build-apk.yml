name: Build APK

# Builds the release APK on GitHub's runners so nobody has to build locally
# on a low-RAM machine. The APK lands on the run page under "Artifacts" and
# is signed with the debug key — fine for testing, not for the Play Store.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: habitoliving-guard-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
